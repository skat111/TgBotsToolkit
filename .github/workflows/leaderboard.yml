name: Update star leaderboard
on:
  push:
    paths: ['scripts/update_leaderboard.py', '.github/workflows/leaderboard.yml']
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/update_leaderboard.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/leaderboard.svg docs/leaderboard.json
          git diff --cached --quiet || (git commit -m "chore: update star leaderboard" && git push)
